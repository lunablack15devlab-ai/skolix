<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Skolix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#141317;
  --bg-deep:#0e0d10;
  --surface:#1c1b20;
  --surface-2:#24232a;
  --surface-3:#2c2b33;
  --border:#332f36;
  --border-soft:#28262d;
  --text:#f3f0ec;
  --text-dim:#a7a3ad;
  --text-faint:#726e7a;
  --red:#a83b4a;
  --red-bright:#c24a5a;
  --red-soft:rgba(168,59,74,0.16);
  --red-soft-2:rgba(168,59,74,0.32);
  --gold:#c9a455;
  --gold-bright:#ddbd76;
  --gold-soft:rgba(201,164,85,0.16);
  --gold-soft-2:rgba(201,164,85,0.34);
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow:0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-deep);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

#phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-left:1px solid var(--border-soft);
  border-right:1px solid var(--border-soft);
}
@media(min-width:431px){
  body{padding:28px 0;}
  #phone{min-height:844px; max-height:844px; border-radius:36px; box-shadow:0 30px 80px rgba(0,0,0,0.6); border:1px solid var(--border);}
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px 18px;
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(150deg,var(--gold) 0%, var(--red) 130%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;font-size:15px;color:#141317;
  flex-shrink:0;
}
.brand-text .name{font-family:'Space Grotesk';font-weight:700;font-size:16.5px;letter-spacing:0.2px;}
.brand-text .school{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);cursor:pointer;position:relative;
}
.icon-btn:active{background:var(--surface-2);}
.dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red-bright);border:1.5px solid var(--bg);}
.avatar{
  width:38px;height:38px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--gold-bright);
  cursor:pointer;
}

/* ---------- Content ---------- */
#content{flex:1;overflow-y:auto;padding:4px 18px 100px 18px;}
.section-title{font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--text-faint);margin:22px 0 10px 2px;letter-spacing:0.1px;}
.section-title:first-child{margin-top:6px;}
.row-between{display:flex;align-items:center;justify-content:space-between;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:16px;
  margin-bottom:12px;
}
.card-tight{padding:13px 14px;}
.hero-card{
  background:linear-gradient(155deg, var(--surface-2) 0%, var(--surface) 65%);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px;
  position:relative;
  overflow:hidden;
}
.hero-card::after{
  content:'';position:absolute;top:-40%;right:-20%;width:180px;height:180px;
  background:radial-gradient(circle, var(--gold-soft) 0%, transparent 70%);
}
.greeting{font-size:12.5px;color:var(--text-faint);}
.greeting-name{font-family:'Space Grotesk';font-size:21px;font-weight:600;margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.stat-box{background:var(--surface-3);border-radius:var(--radius-md);padding:12px;border:1px solid var(--border-soft);}
.stat-num{font-family:'Space Grotesk';font-size:19px;font-weight:700;}
.stat-label{font-size:11px;color:var(--text-faint);margin-top:2px;}

.quick-row{display:flex;gap:9px;overflow-x:auto;margin-top:2px;padding-bottom:2px;}
.quick-chip{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  padding:12px 16px;min-width:78px;cursor:pointer;
}
.quick-chip:active{background:var(--surface-2);}
.quick-chip .qi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.quick-chip span{font-size:11px;color:var(--text-dim);text-align:center;line-height:1.25;}

.list-item{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--border-soft);
}
.list-item:last-child{border-bottom:none;}
.li-icon{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.li-body{flex:1;min-width:0;}
.li-title{font-size:13.5px;font-weight:600;}
.li-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.li-meta{font-size:11px;color:var(--text-faint);text-align:right;flex-shrink:0;}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:100px;
  font-family:'Inter';
}
.badge-gold{background:var(--gold-soft);color:var(--gold-bright);}
.badge-red{background:var(--red-soft);color:var(--red-bright);}
.badge-neutral{background:var(--surface-3);color:var(--text-dim);}
.badge-green{background:rgba(120,168,120,0.16);color:#9ec89e;}

.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 16px;border-radius:13px;border:none;cursor:pointer;
  font-weight:600;font-size:13.5px;font-family:'Inter';
}
.btn-primary{background:linear-gradient(120deg,var(--gold) 0%, #b88d3f 100%);color:#1a1710;}
.btn-primary:active{filter:brightness(0.94);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:active{background:var(--surface-2);}
.btn-danger-outline{background:var(--red-soft);border:1px solid var(--red-soft-2);color:var(--red-bright);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:10px;}

/* ---------- Tabs / segments ---------- */
.seg{display:flex;background:var(--surface);border:1px solid var(--border-soft);border-radius:13px;padding:3px;gap:2px;}
.seg-item{flex:1;text-align:center;padding:8px 6px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--text-faint);cursor:pointer;}
.seg-item.active{background:var(--surface-3);color:var(--text);}
.chip-row{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px 0;}
.chip{flex-shrink:0;padding:7px 13px;border-radius:100px;background:var(--surface);border:1px solid var(--border-soft);font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;}
.chip.active{background:var(--gold-soft);color:var(--gold-bright);border-color:var(--gold-soft-2);}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;background:rgba(28,27,32,0.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--border-soft);
  padding:9px 6px calc(9px + env(safe-area-inset-bottom,0px)) 6px;
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;cursor:pointer;color:var(--text-faint);}
.nav-item.active{color:var(--gold-bright);}
.nav-item span{font-size:10px;font-weight:600;}

/* ---------- Overlay / modal ---------- */
.overlay{
  position:absolute;inset:0;background:rgba(10,9,11,0.66);
  display:flex;align-items:flex-end;z-index:50;
}
.sheet{
  width:100%;background:var(--surface);border-top-left-radius:24px;border-top-right-radius:24px;
  padding:10px 18px 26px 18px;border:1px solid var(--border);border-bottom:none;
  max-height:82%;overflow-y:auto;
}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:10px;margin:6px auto 14px auto;}
.sheet-title{font-family:'Space Grotesk';font-weight:600;font-size:17px;margin-bottom:14px;}
textarea,input[type=text],input[type=date],select{
  width:100%;background:var(--surface-3);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:12px 13px;font-size:13.5px;font-family:'Inter';margin-top:6px;
}
textarea{resize:none;min-height:88px;}
label{font-size:12px;color:var(--text-dim);font-weight:600;}

.toast{
  position:absolute;bottom:96px;left:18px;right:18px;
  background:var(--surface-3);border:1px solid var(--border);border-radius:14px;
  padding:12px 15px;display:flex;align-items:center;gap:10px;
  font-size:12.5px;font-weight:600;z-index:60;box-shadow:var(--shadow);
  animation:toastin 0.22s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Auth screen ---------- */
.auth-wrap{padding:38px 26px 26px 26px;height:100%;display:flex;flex-direction:column;}
.auth-mark{width:58px;height:58px;border-radius:16px;background:linear-gradient(150deg,var(--gold) 0%, var(--red) 130%);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:24px;color:#141317;margin-bottom:20px;}
.auth-title{font-family:'Space Grotesk';font-size:26px;font-weight:700;line-height:1.15;}
.auth-sub{font-size:13.5px;color:var(--text-faint);margin-top:8px;line-height:1.5;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.role-card{
  border:1px solid var(--border-soft);background:var(--surface);border-radius:var(--radius-md);
  padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
}
.role-card.active{border-color:var(--gold-soft-2);background:var(--gold-soft);}
.role-card .ri{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--surface-3);}
.role-card.active .ri{background:rgba(0,0,0,0.18);color:var(--gold-bright);}
.role-card .rn{font-size:13px;font-weight:600;}
.role-card .rd{font-size:10.5px;color:var(--text-faint);}

/* ---------- Discovery / public pages ---------- */
.discover-wrap{padding:22px 18px 26px 18px;}
.discover-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.discover-brand{display:flex;align-items:center;gap:10px;}
.discover-signin{font-size:12px;font-weight:700;color:var(--gold-bright);cursor:pointer;padding:8px 4px;}
.discover-head{margin-bottom:16px;}
.discover-head h1{font-size:21px;font-weight:700;line-height:1.25;margin:0;}
.discover-head p{font-size:12.5px;color:var(--text-faint);margin:6px 0 0 0;line-height:1.5;}
.search-bar{
  display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;color:var(--text-faint);
}
.search-bar input{background:transparent;border:none;padding:0;margin:0;color:var(--text);flex:1;font-size:13.5px;}
.search-bar input::placeholder{color:var(--text-faint);}
.search-bar input:focus{outline:none;}

.school-card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  overflow:hidden;margin-bottom:14px;cursor:pointer;
}
.school-card:active{background:var(--surface-2);}
.school-cover{height:64px;position:relative;}
.school-card-body{padding:14px 16px 16px 16px;display:flex;gap:12px;align-items:flex-start;margin-top:-26px;}
.school-avatar{
  width:52px;height:52px;border-radius:15px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;font-size:19px;color:#17151b;
  border:3px solid var(--surface);box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
.school-info{flex:1;min-width:0;padding-top:4px;}
.school-name{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.school-loc{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.school-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.view-school-btn{
  margin:0 16px 16px 16px;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;border-radius:11px;background:var(--surface-3);border:1px solid var(--border);
  font-size:12.5px;font-weight:700;color:var(--text);
}

/* public school page */
.pub-cover{height:132px;border-radius:0 0 22px 22px;position:relative;margin:0 -18px;}
.pub-topbar{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;}
.pub-header{padding:0 2px;margin-top:-34px;position:relative;}
.pub-avatar{
  width:70px;height:70px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;font-size:26px;color:#17151b;
  border:4px solid var(--bg);box-shadow:0 6px 14px rgba(0,0,0,0.35);
}
.pub-name-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.pub-name{font-family:'Space Grotesk';font-weight:700;font-size:20px;}
.verified-badge{display:flex;align-items:center;gap:3px;background:var(--gold-soft);color:var(--gold-bright);padding:2px 7px;border-radius:100px;font-size:9.5px;font-weight:700;}
.pub-loc{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-faint);margin-top:5px;}
.pub-stats{display:flex;gap:16px;margin-top:12px;}
.pub-stat{font-size:11.5px;color:var(--text-faint);}
.pub-stat b{color:var(--text);font-family:'Space Grotesk';font-size:13px;display:block;}
.join-bar{
  display:flex;gap:10px;margin-top:16px;
}
.signin-link{text-align:center;font-size:12px;color:var(--text-faint);margin-top:12px;}
.signin-link b{color:var(--gold-bright);cursor:pointer;font-weight:700;}

.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
.photo-tile{border-radius:var(--radius-md);aspect-ratio:1.15;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;}
.photo-tile::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.55) 0%, transparent 55%);}
.photo-caption{position:relative;font-size:11px;font-weight:600;color:#fff;}

.verify-wrap{padding:60px 26px 26px 26px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--gold-bright);animation:spin 0.8s linear infinite;margin-bottom:22px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ring */
.ring-wrap{position:relative;width:84px;height:84px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-label .n{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
.ring-label .p{font-size:9px;color:var(--text-faint);}

.empty{text-align:center;padding:34px 10px;color:var(--text-faint);}
.empty .ei{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px auto;}
.empty p{font-size:12.5px;margin:0;}

.grade-bar-track{height:7px;background:var(--surface-3);border-radius:8px;overflow:hidden;}
.grade-bar-fill{height:100%;border-radius:8px;}

.msg-bubble{max-width:78%;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.4;margin-bottom:8px;}
.msg-them{background:var(--surface-3);border-bottom-left-radius:5px;align-self:flex-start;}
.msg-me{background:var(--gold-soft);color:var(--text);border-bottom-right-radius:5px;align-self:flex-end;}
.msg-time{font-size:9.5px;color:var(--text-faint);margin-top:2px;}

.divider{height:1px;background:var(--border-soft);margin:14px 0;}

.attend-toggle{display:flex;gap:6px;}
.att-opt{padding:6px 10px;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid transparent;}
.att-opt.present{color:#9ec89e;}
.att-opt.present.sel{background:rgba(120,168,120,0.18);border-color:rgba(120,168,120,0.3);}
.att-opt.absent{color:var(--red-bright);}
.att-opt.absent.sel{background:var(--red-soft);border-color:var(--red-soft-2);}
.att-opt.late{color:var(--gold-bright);}
.att-opt.late.sel{background:var(--gold-soft);border-color:var(--gold-soft-2);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.cal-dow{text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;padding-bottom:4px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:11.5px;cursor:pointer;position:relative;color:var(--text-dim);}
.cal-cell.pad{visibility:hidden;}
.cal-cell.today{border:1px solid var(--gold-soft-2);}
.cal-cell.sel{background:var(--surface-3);color:var(--text);font-weight:700;}
.cal-dots{display:flex;gap:2px;margin-top:2px;}
.cal-dots span{width:4px;height:4px;border-radius:50%;}

.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;}
.hub-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;}
.hub-card:active{background:var(--surface-2);}
.hub-card .hi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.hub-card .ht{font-size:13.5px;font-weight:700;margin-top:10px;}
.hub-card .hs{font-size:10.5px;color:var(--text-faint);margin-top:2px;}

.subheader{display:flex;align-items:center;gap:12px;padding:14px 0 4px 0;}
.back-btn{width:34px;height:34px;border-radius:11px;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.subheader-title{font-family:'Space Grotesk';font-weight:700;font-size:18px;}

.toggle-pill{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:100px;font-size:11.5px;font-weight:700;cursor:pointer;flex-shrink:0;}
.toggle-on{background:var(--gold-soft);color:var(--gold-bright);}
.toggle-off{background:var(--surface-3);color:var(--text-faint);}
.banner-report{display:flex;align-items:center;gap:8px;background:var(--red-soft);border:1px solid var(--red-soft-2);color:var(--red-bright);padding:10px 12px;border-radius:12px;font-size:11.5px;font-weight:600;margin-bottom:10px;}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.cal-legend-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-faint);}
.cal-legend-item span{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cal-nav{display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>
<div id="phone"></div>

<script>
/* ============================= ICONS ============================= */
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',

function catColor(c){ return c==="urgent"?"var(--red-bright)":c==="celebration"||c==="event"?"var(--gold-bright)":"var(--text-dim)"; }
function catBg(c){ return c==="urgent"?"var(--red-soft)":c==="celebration"||c==="event"?"var(--gold-soft)":"var(--surface-3)"; }
function catIcon(c){ return c==="urgent"?"alert":c==="celebration"?"cake":c==="event"?"calendar":"megaphone"; }

/* calendar-event category helpers (school days/holidays/exams/events/celebrations/important) */
const CAL_CATS = {
  assignment:{label:"Assignment",color:"var(--gold-bright)",bg:"var(--gold-soft)",icon:"book"},
  exam:{label:"Exam / Test",color:"var(--red-bright)",bg:"var(--red-soft)",icon:"alert"},
  event:{label:"Event",color:"var(--gold-bright)",bg:"var(--gold-soft)",icon:"calendar"},
  celebration:{label:"Celebration",color:"var(--gold-bright)",bg:"var(--gold-soft)",icon:"cake"},
  holiday:{label:"Holiday",color:"var(--text-dim)",bg:"var(--surface-3)",icon:"calendar"},
  dayOff:{label:"Day off",color:"var(--text-dim)",bg:"var(--surface-3)",icon:"calendar"},
  important:{label:"Important",color:"var(--red-bright)",bg:"var(--red-soft)",icon:"flag"},
};
function calCat(c){ return CAL_CATS[c] || CAL_CATS.event; }

/* communication-rules recipient <-> mode helpers */
function modeFromArr(arr){ return arr.length>=2 ? "both" : arr[0]; }
function arrFromMode(mode){ return mode==="both" ? ["student","parent"] : [mode]; }
function modeLabel(mode){ return mode==="both"?"Student + Parent":mode==="parent"?"Parent only":"Student only"; }
function nextMode(mode){ return mode==="student"?"parent":mode==="parent"?"both":"student"; }

/* countdown helper for assignment due dates */
function countdown(due_ts, status){
  if(status==="graded") return {label:"Graded", tone:"neutral"};
  if(status==="submitted") return {label:"Submitted", tone:"good"};
  const due = new Date(due_ts);
  const diffMs = due - APP_NOW;
  if(diffMs < 0) return {label:"Overdue", tone:"bad"};
  const mins = Math.round(diffMs/60000);
  const hrs = Math.floor(mins/60);
  const days = Math.floor(hrs/24);
  if(days >= 1) return {label:`${days} day${days>1?'s':''} left`, tone: days<=1?"warn":"good"};
  if(hrs >= 1) return {label:`${hrs}h ${mins%60}m left`, tone: hrs<=3?"warn":"good"};
  return {label:`${mins}m left`, tone:"bad"};
}
function countdownColor(tone){ return tone==="bad"?"var(--red-bright)":tone==="warn"?"var(--gold-bright)":tone==="good"?"#9ec89e":"var(--text-faint)"; }
function countdownBg(tone){ return tone==="bad"?"var(--red-soft)":tone==="warn"?"var(--gold-soft)":tone==="good"?"rgba(120,168,120,0.16)":"var(--surface-3)"; }

/* ============================= CHILD SAFETY / CONTENT SCREENING ============================= */
/* Two-path moderation: content aimed at harming/exploiting someone else is BLOCKED and reported.
   Content revealing the sender's own distress is NOT blocked (cutting it off could be dangerous) —
   it is still delivered, and quietly escalated to admin as an urgent wellbeing check. */
const SAFETY_BLOCKED_TERMS = ["nude","naked","porn","sex","sexual","explicit photo","kill you","gun","weapon","stab","shut up","hate you","stupid","idiot"];
const SAFETY_WELLBEING_TERMS = ["want to die","kill myself","suicide","hurt myself","he hits me","she hits me","hits me at home","unsafe at home","being abused","touched me"];
function scanContent(text){
  const t = (text||"").toLowerCase();
  if(SAFETY_WELLBEING_TERMS.some(k=>t.includes(k))) return {flag:"wellbeing"};
  if(SAFETY_BLOCKED_TERMS.some(k=>t.includes(k))) return {flag:"blocked"};
  return {flag:null};
}
function createSafetyReport(r){
  DB.safetyReports.unshift(Object.assign({ id: Date.now()+Math.random(), date:"Just now", status:"open", parentNotified:false }, r));
}

  const root = document.getElementById('phone');
  if(state.joined){ root.innerHTML = renderApp(); }
  else {
    switch(state.stage){
      case 'schoolPublic': root.innerHTML = renderSchoolPublic(); break;
      case 'signIn': root.innerHTML = renderSignIn(); break;
      case 'joinForm': root.innerHTML = renderJoinForm(); break;
      case 'verifying': root.innerHTML = renderVerifying(); break;

    }
  }
  bindEvents(root);
}

  const toggle = `<div class="seg" style="margin-top:6px;">
      <div class="seg-item ${state.scheduleView==='day'?'active':''}" data-act="schedView" data-v="day">Timetable</div>
      <div class="seg-item ${state.scheduleView==='month'?'active':''}" data-act="schedView" data-v="month">Calendar</div>
    </div>`;

  if(state.scheduleView==='day'){
    const dayList = `<div class="chip-row">${days.map(d=>`<div class="chip ${state.scheduleDay===d?'active':''}" data-act="pickDay" data-d="${d}">${d}</div>`).join('')}</div>`;
    const periods = DB.schedule[state.scheduleDay]||[];
    const list = periods.length ? `<div class="card">${periods.map(p=>`
      <div class="list-item">
        <div class="li-icon" style="background:var(--surface-3);color:var(--gold-bright);">${icon('clock',16)}</div>
        <div class="li-body"><div class="li-title">${p.s}</div><div class="li-sub">${p.r} · ${p.teacher}</div></div>
        <div class="li-meta">${p.t}</div>
      </div>`).join('')}</div>` : emptyState("No classes scheduled this day.");
    return `${toggle}${dayList}${list}`;
  } else {
    return `${toggle}${renderMonthCalendar()}`;
  }
}
function renderMonthCalendar(){
  const year = state.calYear, month = state.calMonth;
  const first = new Date(year,month,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const monthLabel = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let cells=[];
  for(let i=0;i<startDow;i++) cells.push(`<div class="cal-cell pad"></div>`);
  for(let d=1;d<=daysInMonth;d++){
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = DB.calendarEvents[key]||[];
    const isToday = (year===APP_NOW.getFullYear() && month===APP_NOW.getMonth() && d===APP_NOW.getDate());
    const isSel = state.calSelected===key;
    cells.push(`<div class="cal-cell ${isToday?'today':''} ${isSel?'sel':''}" data-act="pickDate" data-date="${key}">
      ${d}
      <div class="cal-dots">${evs.slice(0,3).map(e=>`<span style="background:${calCat(e.cat).color}"></span>`).join('')}</div>
    </div>`);
  }
  const sel = DB.calendarEvents[state.calSelected]||[];
  const canManage = state.role==='teacher'||state.role==='director'||state.role==='manager';
  const legendCats = ['assignment','exam','event','celebration','holiday','important'];
  const legend = `<div class="cal-legend">${legendCats.map(c=>`<div class="cal-legend-item"><span style="background:${calCat(c).color}"></span>${calCat(c).label}</div>`).join('')}</div>`;

  const dayList = sel.map((e,i)=>{
    const cc = calCat(e.cat);
    const photoSection = e.photoSharing ? renderEventPhotos(e,i) : '';
    return `<div class="list-item" style="align-items:flex-start;">
      <div class="li-icon" style="background:${cc.bg};color:${cc.color};">${icon(cc.icon,16)}</div>
      <div class="li-body" style="width:100%;">
        <div class="row-between"><div class="li-title">${e.t}</div><span class="badge badge-neutral">${cc.label}</span></div>
        ${photoSection}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="row-between">

function formatDateLabel(key){

function ring(pct,color){
  const r=32, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<div class="ring-wrap"><svg width="84" height="84"><circle cx="42" cy="42" r="${r}" stroke="var(--surface-3)" stroke-width="7" fill="none"/><circle cx="42" cy="42" r="${r}" stroke="${color}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <div class="ring-label"><div class="n">${pct}%</div><div class="p">present</div></div></div>`;
}

/* ---------- Messages (inbox + thread), permission-aware ---------- */
function threadDisplayName(t,role){
  if(role==='parent') return t.kind==='staffParent' ? t.staffName : t.teacherName;
  if(role==='teacher') return t.kind==='teacherParent' ? t.parentName : t.studentName;
  if(role==='student') return t.teacherName;
  return t.parentName; // director/manager viewing staffParent threads
}
function renderMessagesInbox(){
  if(state.threadOpen) return renderThread(state.threadOpen);
  const role = state.role, perm = DB.commPermissions;
  let threads = [];
  if(role==='teacher') threads = DB.threads.filter(t=>t.kind==='teacherParent'||t.kind==='teacherStudent');
  else if(role==='student') threads = perm.teacherStudent ? DB.threads.filter(t=>t.kind==='teacherStudent' && t.studentName===DB.people.student.name) : [];
  else if(role==='parent') threads = DB.threads.filter(t=>(t.kind==='teacherParent'&&perm.teacherParent)||(t.kind==='staffParent'&&perm.staffParent));
  else threads = perm.staffParent ? DB.threads.filter(t=>t.kind==='staffParent') : [];

  const approvedNote = role==='student' ? `<div class="card" style="margin-top:0;margin-bottom:12px;"><div style="font-size:11.5px;color:var(--text-faint);line-height:1.5;">${icon('lock',11)} You can only message teachers your school has assigned to your classes. Messages are screened for safety before they're sent.</div></div>` : '';

  if(!threads.length){
    const why = role==='student' ? 'Direct messaging between teachers and students is currently turned off by your school.'
      : (role==='director'||role==='manager') ? 'Staff-to-parent messaging is currently turned off.'
      : 'No conversations yet.';
    return subHeader('Messages') + approvedNote + emptyState(why);
  }
  const list = threads.map(t=>{
    const name = threadDisplayName(t,role);
    const sub = t.kind==='teacherParent' ? `Re: ${t.studentName} · ${t.subject}` : t.subject;
    const last = t.messages[t.messages.length-1];
    return `<div class="list-item" data-act="openThread" data-id="${t.id}" style="cursor:pointer;">
      <div class="li-icon" style="background:var(--surface-3);color:var(--gold-bright);">${icon('users',16)}</div>
      <div class="li-body"><div class="li-title">${name}</div><div class="li-sub">${sub}</div></div>
      <div class="li-meta">${last.time}${t.reported?`<div style="color:var(--red-bright);margin-top:4px;">${icon('flag',12)}</div>`:''}</div>
    </div>`;
  }).join('');
  return subHeader('Messages') + approvedNote + `<div class="card">${list}</div>`;
}
function renderThread(id){
  const t = DB.threads.find(x=>x.id===id);
  if(!t) return '';
  const name = threadDisplayName(t,state.role);
  const reportBtn = `<div class="icon-btn" style="width:32px;height:32px;color:${t.reported?'var(--red-bright)':'var(--text-dim)'};" data-act="reportThread" data-id="${t.id}">${icon('flag',15)}</div>`;
  return `
    ${subHeader(name,'closeThread',reportBtn)}
    ${t.reported?`<div class="banner-report">${icon('flag',13)} Reported — this conversation is preserved for school review.</div>`:''}
    <div style="display:flex;flex-direction:column;padding:6px 0 10px 0;">
      ${t.messages.map((m,i)=>`<div style="display:flex;flex-direction:column;align-items:${m.from==='me'?'flex-end':'flex-start'};">
        <div class="msg-bubble ${m.from==='me'?'msg-me':'msg-them'}" ${m.from==='me'?`data-act="deleteMsg" data-tid="${t.id}" data-mi="${i}" style="cursor:pointer;"`:''}>${m.text}</div>
        <div class="msg-time">${m.time}${m.from==='me'?' · tap to delete':''}</div>
      </div>`).join('')}
    </div>
    <div style="position:sticky;bottom:0;display:flex;gap:8px;padding-top:8px;background:var(--bg);">

      <div class="icon-btn" style="background:var(--gold-soft);color:var(--gold-bright);" data-act="sendMsg" data-id="${t.id}">${icon('send',17)}</div>
    </div>
  `;
}

/* ---------- Safety & Reports (director / manager) ---------- */
function renderSafety(){
  const info = `<div class="card"><div style="font-size:12px;color:var(--text-faint);line-height:1.55;">${icon('lock',11)} Reports are visible only to authorized administrators. Skolix automatically screens messages, shared photos and assignment notes for content that violates our safety guidelines — serious matters are escalated here and, where appropriate, a parent or guardian is notified privately.</div></div>`;
  if(!DB.safetyReports.length) return emptyState('No safety reports right now.') + info;
  const typeLabel = t=> t==='auto_block_message'?'Blocked message':t==='auto_block_photo'?'Blocked photo':t==='wellbeing_check'?'Wellbeing check':'User report';
  const rows = DB.safetyReports.map((r,i)=>`
    <div class="list-item" style="padding:14px;align-items:flex-start;${i<DB.safetyReports.length-1?'border-bottom:1px solid var(--border-soft);':''}">
      <div class="li-icon" style="background:${r.severity==='high'?'var(--red-soft)':'var(--surface-3)'};color:${r.severity==='high'?'var(--red-bright)':'var(--text-dim)'};">${icon(r.type==='wellbeing_check'?'shield':'flag',15)}</div>
      <div class="li-body">
        <div class="row-between"><div class="li-title">${r.category}</div>${r.severity==='high'?`<span class="badge badge-red">High priority</span>`:`<span class="badge badge-neutral">Medium</span>`}</div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.5;">${r.summary}</div>
        <div class="li-sub" style="margin-top:6px;">${typeLabel(r.type)} · ${r.participants} · ${r.date}</div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
          <span class="badge ${r.status==='reviewed'?'badge-green':'badge-red'}" style="cursor:pointer;" data-act="reviewReport" data-id="${r.id}">${r.status==='reviewed'?'Reviewed':'Mark reviewed'}</span>
          ${(r.severity==='high' && r.studentInvolved && r.studentInvolved!=='—' && !r.parentNotified) ? `<span class="badge badge-gold" style="cursor:pointer;" data-act="notifyParentFromReport" data-id="${r.id}">${icon('lock',9)} Notify parent</span>` : ''}

        </div>
      </div>
    </div>`).join('');
  return `<div class="card" style="padding:0;">${rows}</div>${info}`;
}

/* ============================= EVENTS ============================= */
function bindEvents(root){
  const codeInput = document.getElementById('schoolCode');
  if(codeInput) codeInput.oninput = e=>{ state.schoolCodeInput = e.target.value; };
  const searchInput = document.getElementById('schoolSearch');
  if(searchInput){
    searchInput.oninput = e=>{ state.searchQuery = e.target.value; render(); document.getElementById('schoolSearch').focus(); document.getElementById('schoolSearch').selectionStart = document.getElementById('schoolSearch').value.length; };
  }
  const joinNameEl = document.getElementById('joinName');
  if(joinNameEl) joinNameEl.oninput = e=>{ state.joinName = e.target.value; };
  const joinCodeEl = document.getElementById('joinCode');
  if(joinCodeEl) joinCodeEl.oninput = e=>{ state.joinCode = e.target.value; };
  const eventTitleEl = document.getElementById('eventTitle');
  if(eventTitleEl) eventTitleEl.oninput = e=>{ state.eventForm.title = e.target.value; };
  const eventDateEl = document.getElementById('eventDate');
  if(eventDateEl) eventDateEl.oninput = e=>{ state.eventForm.date = e.target.value; };
  const noticeBodyEl = document.getElementById('noticeBody');
  if(noticeBodyEl) noticeBodyEl.oninput = e=>{ state.noticeForm.body = e.target.value; };
  const concernBodyEl = document.getElementById('concernBody');
  if(concernBodyEl) concernBodyEl.oninput = e=>{ state.concernForm.body = e.target.value; };

  root.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(el.dataset.act==='overlayBg' && e.target!==el) return; // clicked inside sheet
      handleAction(el.dataset, e);
    });
  });
}

function handleAction(d){
  switch(d.act){
    /* discovery / public pages */
    case 'viewSchool': setState({stage:'schoolPublic', selectedSchool:d.id, publicTab:'announcements'}); break;
    case 'backToDiscover': setState({stage:'discover', selectedSchool:null}); break;
    case 'pubTab': setState({publicTab:d.t}); break;
    case 'openJoin': {
      const sch = DB.schools.find(s=>s.id===(d.id||state.selectedSchool)) || DB.schools[0];
      setState({stage:'joinForm', selectedSchool:sch.id, joinCode: state.joinCode || sch.code, joinCampus: state.joinCampus && sch.campuses.some(c=>c.id===state.joinCampus) ? state.joinCampus : sch.campuses[0].id});
      break;
    }
    case 'backToSchool': setState({stage:'schoolPublic'}); break;
    case 'pickJoinRole': setState({joinRole:d.role}); break;
    case 'pickJoinCampus': setState({joinCampus:d.c}); break;
    case 'submitJoin': {
      const nameEl = document.getElementById('joinName');
      const codeEl = document.getElementById('joinCode');
      const name = nameEl ? nameEl.value.trim() : '';
      const code = codeEl ? codeEl.value.trim() : '';
      state.joinName = name;
      state.joinCode = code;
      const school = DB.schools.find(x=>x.id===state.selectedSchool) || DB.schools[0];
      const campus = school.campuses.find(c=>c.id===state.joinCampus) || school.campuses[0];
      if(!name){ showToast('Enter your full name to continue'); break; }
      if(!code){ showToast('Enter the school code to continue'); break; }
      if(code.toUpperCase() !== school.code.toUpperCase()){ showToast("That code doesn't match " + school.name); break; }
      setState({stage:'verifying'});
      setTimeout(()=>{
        setState({ joined:true, role:state.joinRole, screen:'home', stage:'discover' });
        showToast("You're verified — welcome to " + school.name + " · " + campus.name);
      }, 1400);
      break;
    }
    case 'openSignIn': setState({stage:'signIn'}); break;
    case 'backFromSignIn': setState({stage: state.selectedSchool ? 'schoolPublic' : 'discover'}); break;
    case 'pickSignInRole': setState({signInRole:d.role}); break;
    case 'submitSignIn': setState({joined:true, role:state.signInRole, screen:'home', stage:'discover'}); break;
    case 'exitToDiscover': setState({joined:false, stage:'discover', selectedSchool:null, overlay:null}); break;

    /* private app */
    case 'nav':
      if(d.hub){ setState({screen:'hub', hubOpen:d.hub}); }
      else { setState({screen:d.screen, hubOpen:null, assignmentOpen:null, threadOpen:null}); }
      break;
    case 'schedView': setState({scheduleView:d.v}); break;
    case 'pickDay': setState({scheduleDay:d.d}); break;
    case 'pickDate': setState({calSelected:d.date}); break;
    case 'calNav': {
      let m = state.calMonth + parseInt(d.dir,10);
      let y = state.calYear;
      if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
      setState({calMonth:m, calYear:y});
      break;
    }
    case 'learnTab': setState({learnTab:d.t}); break;
    case 'openAssignment': setState({assignmentOpen:parseInt(d.id,10)}); break;
    case 'closeAssignment': setState({assignmentOpen:null}); break;
    case 'confirmChangeDeadline': {
      const dateEl = document.getElementById('newDueDate');
      const h = DB.homework.find(x=>x.id===state.assignmentOpen);
      if(h && dateEl && dateEl.value){
        h.due_ts = dateEl.value + 'T23:59:00';
        const dt = new Date(h.due_ts);
        h.due = dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      }
      setState({overlay:null});
      showToast('Deadline updated — students notified');
      break;
    }
    case 'confirmSubmitAssignment': {
      const noteEl = document.getElementById('submitNote');
      const note = noteEl ? noteEl.value.trim() : '';
      const hw = DB.homework.find(x=>x.id===state.assignmentOpen);
      let blocked = false;
      if(note){
        const scan = scanContent(note);
        if(scan.flag==='blocked'){
          blocked = true;
          createSafetyReport({type:'auto_block_message', severity:'high', category:'Blocked assignment note', summary:note, participants:`${DB.people.student.name} → ${hw?hw.teacher:'Teacher'}`, studentInvolved:DB.people.student.name, reporter:'System (automatic screening)'});
        } else if(scan.flag==='wellbeing'){
          createSafetyReport({type:'wellbeing_check', severity:'high', category:'Wellbeing check', summary:note, participants:`${DB.people.student.name} → ${hw?hw.teacher:'Teacher'}`, studentInvolved:DB.people.student.name, reporter:'System (automatic screening)'});
        }
      }
      if(hw) hw.status='submitted';
      setState({overlay:null});
      showToast(blocked ? "Assignment submitted — your note couldn't be sent as it may violate safety guidelines." : ('Assignment submitted' + (note?' with your note':'')));
      break;
    }
    case 'sharePhoto': setState({overlay:'sharePhoto'}); break;
    case 'submitPhoto': {
      const capEl = document.getElementById('photoCaption');
      const cap = capEl ? capEl.value.trim() : '';
      if(!cap){ showToast('Add a short caption first'); break; }
      const scan = scanContent(cap);
      const dayEvents = DB.calendarEvents[state.calSelected] || [];
      const ev = dayEvents.find(e=>e.photoSharing);
      if(scan.flag==='blocked'){
        createSafetyReport({type:'auto_block_photo', severity:'high', category:'Blocked photo content', summary:cap, participants:DB.people[state.role].name, studentInvolved: state.role==='teacher'?'—':DB.people.student.name, reporter:'System (automatic screening)'});
        setState({overlay:null});
        showToast("That photo couldn't be shared — it may violate Skolix's safety guidelines. Our safety team has been notified.");
        break;
      }
      if(ev){ ev.photos = ev.photos || []; ev.photos.push({caption:cap, grad:'linear-gradient(135deg,#8a7a4a,#3a3020)', status:'pending'}); }
      if(scan.flag==='wellbeing'){
        createSafetyReport({type:'wellbeing_check', severity:'high', category:'Wellbeing check', summary:cap, participants:DB.people[state.role].name, studentInvolved: DB.people.student.name, reporter:'System (automatic screening)'});
      }
      setState({overlay:null});
      showToast('Photo submitted for approval');
      break;
    }
    case 'pickEventCat': {
      const ps = (d.c==='celebration'||d.c==='event') ? state.eventForm.photoSharing : false;
      setState({eventForm:{...state.eventForm, cat:d.c, photoSharing:ps}});
      break;
    }
    case 'toggleEventPhotoSharing': setState({eventForm:{...state.eventForm, photoSharing:!state.eventForm.photoSharing}}); break;
    case 'submitEvent': {
      const titleEl = document.getElementById('eventTitle');
      const dateEl = document.getElementById('eventDate');
      const title = titleEl ? titleEl.value.trim() : state.eventForm.title;
      const date = dateEl ? dateEl.value : state.eventForm.date;
      if(!title){ showToast('Give the event a title'); break; }
      if(!date){ showToast('Pick a date'); break; }
      DB.calendarEvents[date] = DB.calendarEvents[date] || [];
      const entry = {t:title, cat: state.eventForm.cat};
      if(state.eventForm.photoSharing){ entry.photoSharing = true; entry.photos = []; }
      DB.calendarEvents[date].push(entry);
      setState({overlay:null, calSelected:date, eventForm:{title:"",cat:"event",date:"",photoSharing:false}});
      showToast('Added to the school calendar');
      break;
    }
    case 'openHub': setState({hubOpen:d.h, threadOpen:null}); break;
    case 'closeHub': setState({hubOpen:null, threadOpen:null}); break;
    case 'openOverlay': setState({overlay:d.ov}); break;
    case 'closeOverlay': setState({overlay:null}); break;
    case 'overlayBg': setState({overlay:null}); break;
    case 'switchRole': setState({role:d.role, screen:'home', hubOpen:null, assignmentOpen:null, threadOpen:null, overlay:null}); break;
    case 'setAtt': {
      const s = state.draftAttendance.find(x=>x.id==d.id);
      if(s) s.status = d.s;
      render();
      break;
    }
    case 'saveAttendance': setState({overlay:null}); showToast('Attendance saved · parents notified'); break;
    case 'submitAbsence': {
      const reasonEl = document.getElementById('absReason');
      state.overlay=null;
      showToast('Absence reason submitted for review');
      break;
    }

    /* messaging + safety */
    case 'openThread': setState({threadOpen:d.id}); break;
    case 'closeThread': setState({threadOpen:null}); break;
    case 'deleteMsg': {
      const t = DB.threads.find(x=>x.id===d.tid);
      if(t) t.messages.splice(parseInt(d.mi,10),1);
      render();
      break;
    }
    case 'reportThread': {
      const t = DB.threads.find(x=>x.id===d.id);
      if(t && !t.reported){
        t.reported = true;
        createSafetyReport({type:'user_report', severity:'medium', category:'Reported conversation', summary:'A user reported this conversation for review.', participants: threadDisplayName(t,state.role) + ' thread', studentInvolved: t.studentName || '—', reporter: `${DB.people[state.role].name} (${ROLE_META[state.role].label})`});
        showToast('Reported to school administration for review.');
      }
      render();
      break;
    }
    case 'sendMsg': {
      const input = document.getElementById('msgInput');
      const val = input ? input.value.trim() : '';
      const t = DB.threads.find(x=>x.id===d.id);
      if(val && t){
        const scan = scanContent(val);
        const recipient = threadDisplayName(t,state.role);
        if(scan.flag==='blocked'){
          createSafetyReport({type:'auto_block_message', severity:'high', category:'Blocked message content', summary:val, participants:`${DB.people[state.role].name} → ${recipient}`, studentInvolved: t.studentName || '—', reporter:'System (automatic screening)'});
          state.msgDraft='';
          showToast("Message blocked — it may violate Skolix's safety guidelines. Our safety team has been notified.");
        } else {
          t.messages.push({from:'me',text:val,time:'Now'});
          state.msgDraft='';
          if(scan.flag==='wellbeing'){
            createSafetyReport({type:'wellbeing_check', severity:'high', category:'Wellbeing check', summary:val, participants:`${DB.people[state.role].name} → ${recipient}`, studentInvolved: t.studentName || '—', reporter:'System (automatic screening)'});
            showToast("Message sent. If you're going through something difficult, you're not alone — support is available at school.");
          }
        }
      }
      render();
      break;
    }
    case 'reviewReport': {
      const r = DB.safetyReports.find(x=>x.id==d.id);
      if(r) r.status = r.status==='reviewed' ? 'open' : 'reviewed';
      render();
      break;
    }
    case 'notifyParentFromReport': {
      const r = DB.safetyReports.find(x=>x.id==d.id);
      if(r && !r.parentNotified){
        const parentEntry = DB.parentsDirectory.find(p=>p.student===r.studentInvolved);
        const parentName = parentEntry ? parentEntry.name : DB.people.parent.name;
        DB.privateNotices.unshift({id:Date.now(), to:parentName, toRole:'parent', relatedStudent:r.studentInvolved, from:DB.people[state.role].name, fromTitle:DB.people[state.role].title, category:'Safety notice', body:`Our team reviewed an account safety matter involving ${r.studentInvolved} recently. Please contact the school office if you'd like to discuss further.`, date:'Just now'});
        r.parentNotified = true;
        showToast(`${parentName} notified privately`);
      }
      render();
      break;
    }

    /* communication rules (director / manager) */
    case 'commTab': setState({commTab:d.t}); break;
    case 'togglePerm': DB.commPermissions[d.k] = !DB.commPermissions[d.k]; render(); break;
    case 'cycleRule': {
      const cur = modeFromArr(DB.commRules.defaults[d.k]);
      DB.commRules.defaults[d.k] = arrFromMode(nextMode(cur));
      render();
      break;
    }
    case 'removeOverride': DB.commRules.overrides = DB.commRules.overrides.filter(o=>o.id!=d.id); render(); break;
    case 'pickOverrideScope': setState({overrideForm:{...state.overrideForm, scope:d.s}}); break;
    case 'pickOverrideRule': setState({overrideForm:{...state.overrideForm, rule:d.r}}); break;
    case 'pickOverrideMode': setState({overrideForm:{...state.overrideForm, mode:d.m}}); break;
    case 'submitOverride': {
      DB.commRules.overrides.push({id:Date.now(), scope:state.overrideForm.scope, rule:state.overrideForm.rule, recipients:arrFromMode(state.overrideForm.mode)});
      setState({overlay:null});
      showToast('Override added');
      break;
    }

    /* private notices */
    case 'pickNoticeTo': setState({noticeForm:{...state.noticeForm, to:d.id}}); break;
    case 'pickNoticeCat': setState({noticeForm:{...state.noticeForm, category:d.c}}); break;
    case 'submitNotice': {
      const bodyEl = document.getElementById('noticeBody');
      const body = bodyEl ? bodyEl.value.trim() : state.noticeForm.body;
      const p = DB.parentsDirectory.find(x=>x.id===state.noticeForm.to) || DB.parentsDirectory[0];
      if(!body){ showToast('Write a message first'); break; }
      DB.privateNotices.unshift({id:Date.now(), to:p.name, toRole:'parent', relatedStudent:p.student, from:DB.people[state.role].name, fromTitle:DB.people[state.role].title, category:state.noticeForm.category, body, date:'Just now'});
      setState({overlay:null, noticeForm:{to:state.noticeForm.to, category:state.noticeForm.category, body:''}});
      showToast(`Private notice sent to ${p.name} — not visible to ${p.student}`);
      break;
    }

    /* report a concern */
    case 'pickConcernCat': setState({concernForm:{...state.concernForm, category:d.c}}); break;
    case 'submitConcern': {
      const bodyEl = document.getElementById('concernBody');
      const body = bodyEl ? bodyEl.value.trim() : state.concernForm.body;
      if(!body){ showToast('Add a few details first'); break; }
      createSafetyReport({type:'user_report', severity:'high', category:state.concernForm.category, summary:body, participants:`${DB.people[state.role].name} (${ROLE_META[state.role].label})`, studentInvolved: state.role==='student'||state.role==='parent' ? DB.people.student.name : '—', reporter:`${DB.people[state.role].name} (${ROLE_META[state.role].label})`});
      setState({overlay:null, concernForm:{category:state.concernForm.category, body:''}});
      showToast('Report sent to school administrators — thank you for speaking up.');
      break;
    }

    case 'toast': showToast(d.msg); break;
  }
}

render();
</script>
</body>
</html>
